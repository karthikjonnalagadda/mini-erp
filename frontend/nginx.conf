# =============================================================================
# nginx configuration for the SPA.
# =============================================================================

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hide the version banner — free information for an attacker fingerprinting
  # the stack.
  server_tokens off;

  # ---------------------------------------------------------------------------
  # SPA history fallback.
  #
  # React Router owns the URL space. Without this, a hard refresh on
  # /customers/abc-123 asks nginx for a file that does not exist and returns
  # 404. Falling back to index.html lets the client router resolve the route.
  # ---------------------------------------------------------------------------
  location / {
    try_files $uri $uri/ /index.html;
  }

  # ---------------------------------------------------------------------------
  # Caching.
  #
  # Vite fingerprints asset filenames (index-CH1N2bK4.js), so those files are
  # immutable — cache them for a year. index.html must NEVER be cached: it is
  # the manifest that points at the current fingerprints, and a stale copy
  # references deleted files, producing a blank page after every deploy.
  # ---------------------------------------------------------------------------
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
    expires 0;
  }

  # ---------------------------------------------------------------------------
  # Compression. Vite output is highly compressible text.
  # ---------------------------------------------------------------------------
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

  # ---------------------------------------------------------------------------
  # Security headers. The API sets its own; these protect the static origin.
  # ---------------------------------------------------------------------------
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Source maps are built with `sourcemap: 'hidden'` — present for error
  # reporting tools, but not advertised. Block public access to them.
  location ~* \.map$ {
    deny all;
    return 404;
  }
}
