# =============================================================================
# Render blueprint (Infrastructure as Code).
#
# Deploy with:  New -> Blueprint -> point at this repo.
#
# The database is deliberately NOT declared here. Neon is the chosen Postgres
# host (see the README), so `DATABASE_URL` is supplied as a dashboard secret
# rather than provisioned by Render. To use Render Postgres instead, uncomment
# the `databases:` block at the bottom and switch DATABASE_URL to `fromDatabase`.
# =============================================================================

services:
  - type: web
    name: mini-erp-crm-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    rootDir: backend

    buildCommand: npm ci && npx prisma generate && npm run build

    # `migrate deploy` (not `migrate dev`) applies pending migrations without
    # prompting or generating new ones — the only correct choice in a deploy
    # pipeline. Running it in preDeploy rather than at boot means a failed
    # migration aborts the release instead of crash-looping a live instance.
    preDeployCommand: npx prisma migrate deploy

    startCommand: node dist/server.js

    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: API_PREFIX
        value: /api/v1

      # --- Secrets: set these in the Render dashboard -----------------------
      # Neon connection string, including `?sslmode=require`.
      - key: DATABASE_URL
        sync: false

      # Generated per environment. Never reuse across environments.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: BCRYPT_SALT_ROUNDS
        value: 12

      # Must exactly match the deployed Vercel origin — no trailing slash, and
      # the scheme matters. A mismatch here is the single most common cause of
      # "it works locally but the browser blocks it in production".
      - key: CORS_ORIGINS
        sync: false

      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX
        value: 300
      - key: AUTH_RATE_LIMIT_MAX
        value: 10
      - key: LOG_LEVEL
        value: info

      # Seed credentials. Change before exposing the deployment publicly.
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
# --- Optional: Render-hosted Postgres instead of Neon ------------------------
# databases:
#   - name: mini-erp-crm-db
#     plan: free
#     region: singapore
#     databaseName: mini_erp
#     user: erp
#
# Then replace the DATABASE_URL entry above with:
#   - key: DATABASE_URL
#     fromDatabase:
#       name: mini-erp-crm-db
#       property: connectionString
